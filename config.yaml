# qBittorrent category classifier — configuration
# All settings are tunable here without editing code.
# Secrets can be overridden via env vars (e.g. QB_PASS, GOOGLE_BOOKS_API_KEY),
# or by creating a git-ignored config.local.yaml file in this directory.

# ── qBittorrent connection ────────────────────────────────────────────────
qb:
  url: "http://192.168.1.116:8084"
  user: "bidalos"
  password: ""                 # must set QB_PASS env var or config.local.yaml
  source_category: "books"    # category the daemon watches (or set QB_SOURCE_CATEGORY)

# ── Library / hardlinking ─────────────────────────────────────────────────
# Destination root for hardlink.sh (or set LIBRARY_ROOT).
# Must be inside the same bind mount as qBittorrent downloads for hardlinks
# to share the same inode (see docker-compose.yml /data/books layout).
library:
  root: "/data/books/library"

# Hardlink script invoked after a torrent is re-categorized (or set
# HARDLINK_SCRIPT / HARDLINK_ENABLED).
hardlink:
  script: "/app/hardlink.sh"
  enabled: true

# ── Logging ───────────────────────────────────────────────────────────────
# File + console logging (or set LOG_FILE / LOG_LEVEL).
log:
  file: "/app/logs/classifier.log"
  level: "INFO"

# ── Polling ───────────────────────────────────────────────────────────────
poll_interval: 10            # seconds between polls

# ── Classification thresholds ─────────────────────────────────────────────
# confidence >= auto_threshold  → auto-route (tag "classified")
# confidence <  review_threshold → tag "review" (user should correct)
thresholds:
  auto: 0.90
  review: 0.70

# ── Default category when the whole cascade can't determine the type ───────
default_category: "ebooks"

# ── qBit tags that act as a manual override (highest priority) ─────────────
# If a torrent carries one of these tags, it is routed to that category
# without any metadata/regex lookup.
tag_overrides:
  manga: manga
  manhwa: manhwa
  manhua: manhua
  webtoon: webtoon
  comics: comics
  bd: bd
  light-novel: light-novel
  ebooks: ebooks
  mags: mags
  audiobooks: audiobooks
  artbook: artbook
  doujinshi: doujinshi

# ── Book/comics categories used by the classifier ────────────────────────
# Map internal category name → qBittorrent category.
categories:
  manga: manga
  manhwa: manhwa
  manhua: manhua
  webtoon: webtoon
  comics: comics
  bd: bd
  light-novel: light-novel
  ebooks: ebooks
  mags: mags
  audiobooks: audiobooks
  artbook: artbook
  doujinshi: doujinshi

# ── Metadata providers ────────────────────────────────────────────────────
# Enable/disable providers and set per-provider rate limits (seconds).
# Keys can be set here or via env vars (GOOGLE_BOOKS_API_KEY).
metadata:
  enabled: true
  timeout_seconds: 45           # max time to spend querying providers per title
  flaresolverr_url: "http://192.168.1.116:8193"   # Trawl/FlareSolverr/Byparr
  flaresolverr_retries: 3      # retry count for JS solver requests
  flaresolverr_backoff_seconds: 2.0  # base exponential backoff
  google_books_api_key: ""      # or set GOOGLE_BOOKS_API_KEY env var
  comicvine_api_key: ""         # or set COMICVINE_API_KEY env var
  langsearch_api_key: ""        # or set LANGSEARCH_API_KEY env var

  providers:
    mangadex:
      enabled: true
      rate_limit: 0.25
    mangabaka:
      enabled: true
      rate_limit: 2.25
    jikan:
      enabled: true
      rate_limit: 0.35
    kitsu:
      enabled: true
      rate_limit: 1.5
    shikimori:
      enabled: true
      rate_limit: 0.75
    openlibrary:
      enabled: true
      rate_limit: 1.1
    googlebooks:
      enabled: true
      rate_limit: 1.0
    comicvine:
      enabled: true
      rate_limit: 1.2
    planetebd:
      enabled: true
      rate_limit: 2.5
    bedetheque:
      enabled: true
      rate_limit: 2.0
    bdtheque:
      enabled: true
      rate_limit: 2.2
    ranobedb:
      enabled: true
      rate_limit: 0.6

# ── LLM final-arbiter (optional, OFF by default) ─────────────────────────
# When metadata providers, regex rules, and extension signals all fail to
# classify a release, the classifier makes one final call to this LLM.
# Supports Gemini v1beta native API, OpenAI-compatible endpoints, and Ollama.
# Set enabled: true to activate.
# Env overrides: LLM_ENABLED, LLM_ENDPOINT, LLM_MODEL, LLM_API_KEY, LLM_TIMEOUT.
llm:
  enabled: false
  mode: "fallback"     # "fallback" = only when cascade is uncertain; "verify" = always check
  # Legacy single-provider keys (still supported; used when providers list is empty).
  endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent"
  model: "gemini-flash-latest"
  api_key: ""          # your Gemini API key (or set LLM_API_KEY in .env)
  timeout: 30          # seconds per request
  # Multi-provider fallback list (preferred). If non-empty it overrides the legacy keys above.
  # The classifier tries each provider in order, falling back on 429/403/quota or transient failure.
  # providers:
  #   - endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent"
  #     model: "gemini-flash-latest"
  #     api_key: "YOUR_GEMINI_KEY"
  #     timeout: 30
  #   - endpoint: "https://openrouter.ai/api/v1/chat/completions"
  #     model: "google/gemma-4-26b-a4b-it:free"
  #     api_key: "sk-or-v1-..."
  #     timeout: 30
  providers: []
  delay_seconds: 10.0  # seconds between LLM calls to stay within free-tier RPM limits
  cooldown_minutes: 5  # per-provider cooldown after rate-limit/quota

# ── Regex rules (fast-path fallback when metadata is off/unavailable) ─────
# Each category has a list of (regex, weight) patterns and a min_score.
# The FIRST category whose total score >= min_score wins. Order matters.
rules:
  audiobooks:
    min_score: 0.9
    patterns:
      - ["(?i)\\baudiobook\\b", 1.0]
      - ["(?i)\\.m4b\\b", 1.0]
      - ["(?i)\\[m4b\\]", 1.0]
      - ["(?i)\\baac\\b", 0.9]
      - ["(?i)\\bkbps\\b", 0.9]
      - ["(?i)\\bmp3\\b", 0.8]
  mags:
    min_score: 0.9
    patterns:
      - ["(?i)\\bmagazine\\b", 1.0]
      - ["(?i)\\be?book[- ]magazine\\b", 1.0]
      - ["(?i)\\be?book[- ]p?ro\\b", 0.9]
      - ["(?i)\\bjournaux\\b", 1.0]
      - ["(?i)\\bpack\\.?journaux\\b", 1.0]
      - ["(?i)\\bissue\\b", 0.9]
      - ["(?i)\\bweekly\\b", 0.8]
      - ["(?i)\\bI\\d{2,3}\\b", 0.8]
      - ["(?i)\\bnewspaper\\b", 1.0]
      - ["(?i)\\bpresse\\b", 0.9]
      - ["(?i)\\bgazzetta\\b", 1.0]
      - ["(?i)\\bcorriere\\b", 1.0]
      - ["(?i)\\bsole 24 ore\\b", 1.0]
      - ["(?i)\\be?book[- ]?i(dib|diver)\\b", 0.9]
  manga:
    min_score: 0.9
    patterns:
      - ["(?i)\\bmanga\\b", 1.0]
      - ["(?i)\\bscanlation\\b", 0.9]
      - ["(?i)\\braw\\b", 0.8]
      - ["(?i)\\bdlraw\\b", 1.0]
      - ["(?i)\\b13dl\\b", 1.0]
      - ["(?i)\\bmanga[- ]zip\\b", 1.0]
      - ["(?i)\\bviz media\\b", 1.0]
      - ["(?i)\\bhybrid manga\\b", 1.0]
      - ["(?i)\\bT\\d{1,4}\\b", 0.9]
      - ["(?i)\\b[0-9]{4}\\b.*\\bvol\\.?\\s*\\d+\\b", 0.3]
  manhwa:
    min_score: 0.9
    patterns:
      - ["(?i)\\bmanhwa\\b", 1.0]
      - ["(?i)\\bkorean\\b", 0.8]
      - ["(?i)\\bwebtoon\\b", 0.9]
      - ["(?i)\\bch\\.?\\d{1,4}(-ch\\.?\\d{1,4})?\\b", 1.0]
      - ["(?i)\\bep\\.?\\d{1,4}\\b", 0.9]
  comics:
    min_score: 0.9
    patterns:
      - ["(?i)\\bmarvel\\b", 1.0]
      - ["(?i)\\bdc\\b", 0.8]
      - ["(?i)\\bannual\\b", 0.8]
      - ["(?i)\\bgraphic novel\\b", 0.9]
      - ["(?i)\\bcomic\\b", 0.8]
      - ["(?i)\\bscanner\\b", 0.7]
      - ["(?i)\\bdigital\\b", 0.3]
      - ["(?i)\\bTO\\d{1,4}\\b", 0.9]
      - ["(?i)\\bson of ultron\\b", 0.9]
      - ["(?i)\\bzone-empire\\b", 0.9]
  bd:
    min_score: 0.9
    patterns:
      - ["(?i)\\bglenat\\b", 1.0]
      - ["(?i)\\bdupuis\\b", 1.0]
      - ["(?i)\\bcasterman\\b", 1.0]
      - ["(?i)\\blombard\\b", 1.0]
      - ["(?i)\\bdargaud\\b", 1.0]
      - ["(?i)\\bdelcourt\\b", 1.0]
      - ["(?i)\\bbamboo\\b", 1.0]
      - ["(?i)\\balbin[- ]michel\\b", 1.0]
      - ["(?i)\\bclair[- ]de[- ]lune\\b", 1.0]
      - ["(?i)\\bsoleil\\b", 0.8]
      - ["(?i)\\bbande dessin", 1.0]
      - ["(?i)\\bfranco[- ]belge\\b", 1.0]
      - ["(?i)\\b\\[?bd\\]?\\b", 0.7]
      - ["(?i)\\b\\[?int?egrale\\]?\\b", 0.7]
      - ["(?i)\\b\\[?collection\\]?\\b", 0.7]
      - ["(?i)\\b\\[?tome\\]?\\b", 0.7]
      - ["(?i)\\bfr\\b", 0.3]
      - ["(?i)\\bfrench\\b", 0.3]
      - ["(?i)\\bcbr\\b", 0.4]
      - ["(?i)\\bcb[rz]\\b", 0.4]
  manhua:
    min_score: 0.9
    patterns:
      - ["(?i)\\bmanhua\\b", 1.0]
      - ["(?i)\\bchinese\\b(?=.*\\b(comic|manga|manhua)\\b)", 0.8]
      - ["(?i)\\bcn[- ]?comic\\b", 1.0]
  artbook:
    min_score: 0.9
    patterns:
      - ["(?i)\\bartbook\\b", 1.0]
      - ["(?i)\\bart[- ]book\\b", 1.0]
      - ["(?i)\\billustrations\\b", 0.9]
      - ["(?i)\\bsetting materials\\b", 0.9]
      - ["(?i)\\bvisual works\\b", 0.9]
      - ["(?i)\\bdoujinshi\\b", 0.9]
  doujinshi:
    min_score: 0.9
    patterns:
      - ["(?i)\\bdoujin(?:shi)?\\b", 1.0]
      - ["(?i)\\bcircle\\b", 0.7]
      - ["(?i)\\bcomiket\\b", 1.0]
  light-novel:
    min_score: 0.9
    patterns:
      - ["(?i)\\blight[- ]?novel\\b", 1.0]
      - ["(?i)\\bln\\b", 0.6]
      - ["(?i)\\bpart\\s*\\d+\\b", 0.6]
      - ["(?i)\\bvol\\.?\\s*\\d+\\b", 0.4]
      - ["(?i)\\bannas[. ]archive\\b", 0.7]
