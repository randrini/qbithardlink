# qBittorrent category classifier — Docker Compose
# Build & run:  docker compose up -d --build
#
# The daemon watches the qBittorrent category set in QB_SOURCE_CATEGORY and
# classifies each torrent as manga/webtoon/comics/bd/light-novel/ebooks.
# It then hardlinks the completed content into LIBRARY_ROOT.
#
# REQUIRED: create a .env file (see .env.example) and edit the ADJUST path below.
# Layout for hardlinks: one host share is mounted at /data/books; qBittorrent
# downloads live under /data/books/torrents and the library under
# /data/books/library. Both are inside the same bind mount so hardlinks work.
services:
  classifier:
    build: .
    container_name: qbit-classifier
    restart: unless-stopped
    # Use the host's working DNS directly; Docker's embedded resolver (127.0.0.11)
    # can be unreliable on Unraid/VPN setups and cause intermittent name-resolution failures.
    dns:
      - ${DNS_PRIMARY:-192.168.1.172}
      - ${DNS_SECONDARY:-89.168.34.79}
    environment:
      # User/Group that will own created files/hardlinks (Unraid default: nobody/users).
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      # qBittorrent WebUI credentials (QB_PASS must be set in .env).
      - QB_URL=${QB_URL:-http://192.168.1.116:8084}
      - QB_USER=${QB_USER:-bidalos}
      - QB_PASS=${QB_PASS:?Set QB_PASS in .env or export it before running docker compose up}
      # Category to watch; new book/comic torrents should start here.
      - QB_SOURCE_CATEGORY=${QB_SOURCE_CATEGORY:-books}
      # Library root for hardlinks (must be under the same bind mount as downloads).
      - LIBRARY_ROOT=${LIBRARY_ROOT:-/data/books/library}
      - HARDLINK_SCRIPT=${HARDLINK_SCRIPT:-/app/hardlink.sh}
      - HARDLINK_ENABLED=${HARDLINK_ENABLED:-true}
      # Logging.
      - LOG_FILE=${LOG_FILE:-/app/logs/classifier.log}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      # Trawl/FlareSolverr endpoint for JS-protected BD providers.
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://192.168.1.116:8193}
      # Optional API keys.
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      # LLM final-arbiter (off by default). Supports Gemini v1beta native API,
      # OpenAI-compatible endpoints, and Ollama. Set LLM_ENABLED=true to activate.
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_MODE=${LLM_MODE:-fallback}
      # Multi-provider list as a JSON array string. If set, it overrides the
      # legacy single-provider env vars below. Example:
      # LLM_PROVIDERS='[{"endpoint":"...","model":"...","api_key":"...","timeout":30},...]'
      - LLM_PROVIDERS=${LLM_PROVIDERS:-}
      # Legacy single-provider env vars (still supported; used when LLM_PROVIDERS is empty).
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}
      - LLM_MODEL=${LLM_MODEL:-gemini-flash-latest}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      - LLM_COOLDOWN_MINUTES=${LLM_COOLDOWN_MINUTES:-10}
    volumes:
      # Source code (bind-mounted for easy updates; the Dockerfile also copies them).
      - ./classifier.py:/app/classifier.py:ro
      - ./metadata.py:/app/metadata.py:ro
      - ./config.py:/app/config.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./qblib.py:/app/qblib.py:ro
      - ./hardlink.sh:/app/hardlink.sh:ro
      - ./bootstrap_categories.py:/app/bootstrap_categories.py:ro
      - ./move_torrents_to_books_share.py:/app/move_torrents_to_books_share.py:ro
      - ./reprocess_all_books.py:/app/reprocess_all_books.py:ro
      - ./test_release.py:/app/test_release.py:ro
      - ./test_jikan.py:/app/test_jikan.py:ro
      - ./test_providers.py:/app/test_providers.py:ro
      # Optional local secrets (git-ignored) — create config.local.yaml if needed.
      - ./config.local.yaml:/app/config.local.yaml:ro
      # Persistent logs (classifier.log + hardlink.log).
      - ./logs:/app/logs
      # Persistent idempotency state (file lives inside this directory).
      - ./state:/app/state
      # ═══ ADJUST via .env: BOOKS_SHARE_PATH ═══
      # Single host share mounted at /data/books. Both downloads and library live
      # inside it so hardlinks share the same inode. Use cache or array as you prefer.
      - ${BOOKS_SHARE_PATH:-/mnt/user/data/books}:/data/books
