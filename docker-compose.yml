# qBittorrent category classifier — Docker Compose
# Build & run:  docker compose up -d --build
#
# The daemon watches the qBittorrent category set in QB_SOURCE_CATEGORY and
# classifies each torrent as manga/webtoon/comics/bd/light-novel/ebooks.
# It then hardlinks the completed content into LIBRARY_ROOT.
#
# REQUIRED: create a .env file (see .env.example) and edit the ADJUST paths below.
services:
  classifier:
    build: .
    container_name: qbit-classifier
    restart: unless-stopped
    environment:
      # User/Group that will own created files/hardlinks (Unraid default: nobody/users).
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      # qBittorrent WebUI credentials (QB_PASS must be set in .env).
      - QB_URL=${QB_URL:-http://192.168.1.116:8084}
      - QB_USER=${QB_USER:-bidalos}
      - QB_PASS=${QB_PASS:?Set QB_PASS in .env or export it before running docker compose up}
      # Category to watch; new book/comic torrents should start here.
      - QB_SOURCE_CATEGORY=${QB_SOURCE_CATEGORY:-books}
      # Destination root for hardlinks (must match the bind-mount below).
      - LIBRARY_ROOT=${LIBRARY_ROOT:-/data/media/books}
      - HARDLINK_SCRIPT=${HARDLINK_SCRIPT:-/app/hardlink.sh}
      - HARDLINK_ENABLED=${HARDLINK_ENABLED:-true}
      # Logging.
      - LOG_FILE=${LOG_FILE:-/app/logs/classifier.log}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      # Trawl/FlareSolverr endpoint for JS-protected BD providers.
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://192.168.1.116:8193}
      # Optional API keys.
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      # LLM final-arbiter (off by default). Supports Gemini v1beta native API,
      # OpenAI-compatible endpoints, and Ollama. Set LLM_ENABLED=true to activate.
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_MODE=${LLM_MODE:-fallback}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
    volumes:
      # Source code (bind-mounted for easy updates; the Dockerfile also copies them).
      - ./classifier.py:/app/classifier.py:ro
      - ./metadata.py:/app/metadata.py:ro
      - ./config.py:/app/config.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./hardlink.sh:/app/hardlink.sh:ro
      # Optional local secrets (git-ignored) — create config.local.yaml if needed.
      - ./config.local.yaml:/app/config.local.yaml:ro
      # Persistent logs (classifier.log + hardlink.log).
      - ./logs:/app/logs
      # Persistent idempotency state (file lives inside this directory).
      - ./state:/app/state
      # ═══ ADJUST via .env: DOWNLOAD_PATH and LIBRARY_PATH ═══
      # qBittorrent downloads — must be the SAME filesystem as LIBRARY_ROOT for hardlinks.
      - ${DOWNLOAD_PATH:-/mnt/user/data/torrents}:/data/torrents
      # Library destination for hardlinks.
      - ${LIBRARY_PATH:-/mnt/user/media/books}:/data/media/books
